name: Publish PowerShell Gallery

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Exact Gallery version to publish, for example 0.5.0-preview1. The matching v<version> Git tag must already exist.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: powershell-gallery-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.expected_version }}
          fetch-depth: 0

      - name: Verify release tag
        shell: powershell
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedTag = "v$env:EXPECTED_VERSION"
          $exactTag = (git describe --tags --exact-match HEAD 2>$null).Trim()
          if ($LASTEXITCODE -ne 0 -or $exactTag -ne $expectedTag) {
              throw "PSGallery publication must run from immutable tag '$expectedTag'. Checked out HEAD is not that exact tag."
          }
          Write-Host "Publishing source is pinned to tag $exactTag at commit $env:GITHUB_SHA."

      - name: Build Gallery package
        shell: powershell
        run: .\tools\New-GalleryPackage.ps1

      - name: Validate release package
        id: release
        shell: powershell
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packagePath = Join-Path $PWD 'out\WindowsDeviceLink'
          $manifestPath = Join-Path $packagePath 'WindowsDeviceLink.psd1'
          $manifest = Test-ModuleManifest -Path $manifestPath -ErrorAction Stop
          $manifestData = Import-PowerShellDataFile -Path $manifestPath

          $baseVersion = $manifest.Version.ToString()
          $prerelease = [string]$manifestData.PrivateData.PSData.Prerelease
          $galleryVersion = if ([string]::IsNullOrWhiteSpace($prerelease)) { $baseVersion } else { "$baseVersion-$prerelease" }

          if ($env:EXPECTED_VERSION -ne $galleryVersion) {
              throw "Expected version '$($env:EXPECTED_VERSION)' does not match manifest version '$galleryVersion'."
          }

          if ('Clear-WindowsDeviceLinkFirmwareState' -in $manifest.ExportedFunctions.Keys) {
              throw 'Deprecated pre-release command name is still exported.'
          }

          $requiredFunctions = @(
              'Complete-WindowsDeviceLinkAssociation',
              'Connect-WindowsDeviceLink',
              'Export-WindowsDeviceLinkCsv',
              'Get-WindowsDeviceLink',
              'Get-WindowsDeviceLinkAssociation',
              'Get-WindowsDeviceLinkFirmwareState',
              'Get-WindowsDeviceLinkRepairPlan',
              'Get-WindowsDeviceLinkStatus',
              'Initialize-WindowsDeviceLink',
              'Register-WindowsDeviceLink',
              'Remove-WindowsDeviceLinkAssociation',
              'Reset-WindowsDeviceLinkFirmwareState',
              'Test-WindowsDeviceLinkAssociationJwt',
              'Test-WindowsDeviceLinkDiscovery',
              'Test-WindowsDeviceLinkHealth',
              'Test-WindowsDeviceLinkPreflight',
              'Test-WindowsDeviceLinkSupport'
          )
          foreach ($function in $requiredFunctions) {
              if ($function -notin $manifest.ExportedFunctions.Keys) {
                  throw "Required public function '$function' is not exported."
              }
          }

          Import-Module $manifestPath -Force
          $loadedModule = Get-Module WindowsDeviceLink -ErrorAction Stop
          if (-not $loadedModule.Path.StartsWith($packagePath, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Validation imported WindowsDeviceLink from unexpected path '$($loadedModule.Path)' instead of staged package '$packagePath'."
          }

          $localGet = Get-Command Get-WindowsDeviceLink -Module WindowsDeviceLink -ErrorAction Stop
          if ($localGet.Parameters.ContainsKey('Online')) {
              throw 'Get-WindowsDeviceLink still exposes deprecated -Online semantics.'
          }

          $status = Get-Command Get-WindowsDeviceLinkStatus -Module WindowsDeviceLink -ErrorAction Stop
          if (-not $status.Parameters.ContainsKey('Online')) {
              throw 'Get-WindowsDeviceLinkStatus must expose explicit -Online diagnostics.'
          }

          $initializer = Get-Command Initialize-WindowsDeviceLink -Module WindowsDeviceLink -ErrorAction Stop
          if (-not $initializer.Parameters.ContainsKey('WhatIf')) {
              throw 'Initialize-WindowsDeviceLink must support ShouldProcess / -WhatIf.'
          }
          if (-not $initializer.Parameters.ContainsKey('CompleteAssociation')) {
              throw 'Initialize-WindowsDeviceLink must expose explicit -CompleteAssociation opt-in.'
          }

          $completion = Get-Command Complete-WindowsDeviceLinkAssociation -Module WindowsDeviceLink -ErrorAction Stop
          if (-not $completion.Parameters.ContainsKey('WhatIf')) {
              throw 'Complete-WindowsDeviceLinkAssociation must support ShouldProcess / -WhatIf.'
          }

          $discovery = Get-Command Test-WindowsDeviceLinkDiscovery -Module WindowsDeviceLink -ErrorAction Stop
          if ($discovery.Parameters.ContainsKey('WhatIf') -or $discovery.Parameters.ContainsKey('Confirm')) {
              throw 'Test-WindowsDeviceLinkDiscovery must remain read-only and must not expose ShouldProcess controls.'
          }

          $firmwareReset = Get-Command Reset-WindowsDeviceLinkFirmwareState -Module WindowsDeviceLink -ErrorAction Stop
          if (-not $firmwareReset.Parameters.ContainsKey('WhatIf')) {
              throw 'Reset-WindowsDeviceLinkFirmwareState must support ShouldProcess / -WhatIf.'
          }

          $forbiddenDll = Join-Path $packagePath 'Runtime\Windows.Management.Service.dll'
          if (Test-Path -LiteralPath $forbiddenDll) {
              throw 'Windows.Management.Service.dll must not be included in the Gallery package.'
          }

          $unexpectedDlls = @(Get-ChildItem -LiteralPath $packagePath -Recurse -File -Filter '*.dll')
          if ($unexpectedDlls.Count -gt 0) {
              throw "Unexpected DLL files are present in the Gallery package: $($unexpectedDlls.FullName -join ', ')"
          }

          # Hardware-independent regression suites run against the exact staged artifact.
          & (Join-Path $PWD 'tests\Public-Contract-Validation.ps1') -ModulePath $manifestPath -PackageRoot $packagePath
          if (-not $?) { throw 'Public-Contract-Validation.ps1 failed.' }

          & (Join-Path $PWD 'tests\Health-State-Validation.ps1') -ModulePath $manifestPath
          if (-not $?) { throw 'Health-State-Validation.ps1 failed.' }

          & (Join-Path $PWD 'tests\Online-Method-Validation.ps1') -ModulePath $manifestPath
          if (-not $?) { throw 'Online-Method-Validation.ps1 failed.' }

          Remove-Module WindowsDeviceLink -Force -ErrorAction SilentlyContinue
          Import-Module $manifestPath -Force
          $smokeModule = Get-Module WindowsDeviceLink -ErrorAction Stop
          if ($smokeModule.Version.ToString() -ne $baseVersion) {
              throw "Staged artifact smoke import returned version '$($smokeModule.Version)' instead of '$baseVersion'."
          }
          if (-not $smokeModule.Path.StartsWith($packagePath, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Staged artifact smoke test imported the module from an unexpected path.'
          }

          "gallery_version=$galleryVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Release package validation passed for WindowsDeviceLink $galleryVersion."
          Write-Host "Validated staged artifact: $manifestPath"

      - name: Publish to PowerShell Gallery
        shell: powershell
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          GALLERY_VERSION: ${{ steps.release.outputs.gallery_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) { throw 'PSGALLERY_API_KEY is not available.' }

          Write-Host "Publishing WindowsDeviceLink $env:GALLERY_VERSION from immutable release tag to PSGallery..."
          Publish-Module `
              -Path (Join-Path $PWD 'out\WindowsDeviceLink') `
              -Repository PSGallery `
              -NuGetApiKey $env:PSGALLERY_API_KEY `
              -Force
          Write-Host "Publish-Module completed for WindowsDeviceLink $env:GALLERY_VERSION."
