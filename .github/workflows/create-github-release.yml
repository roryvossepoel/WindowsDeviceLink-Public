name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Expected release version, for example 0.4.3-preview1. Leave empty to use the manifest.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and resolve version
        id: release
        shell: powershell
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $PWD 'src\WindowsDeviceLink\WindowsDeviceLink.psd1'
          $manifest = Test-ModuleManifest -Path $manifestPath -ErrorAction Stop
          $manifestData = Import-PowerShellDataFile -Path $manifestPath

          $baseVersion = $manifest.Version.ToString()
          $prerelease = [string]$manifestData.PrivateData.PSData.Prerelease
          $releaseVersion = if ([string]::IsNullOrWhiteSpace($prerelease)) {
              $baseVersion
          } else {
              "$baseVersion-$prerelease"
          }
          $tag = "v$releaseVersion"

          if (-not [string]::IsNullOrWhiteSpace($env:EXPECTED_VERSION) -and $env:EXPECTED_VERSION -ne $releaseVersion) {
              throw "Expected version '$($env:EXPECTED_VERSION)' does not match manifest version '$releaseVersion'."
          }

          "release_version=$releaseVersion" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "is_prerelease=$(-not [string]::IsNullOrWhiteSpace($prerelease))" >> $env:GITHUB_OUTPUT

          Write-Host "Resolved release: $tag"

      - name: Check existing tag and release
        id: existing
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          git fetch --tags --force
          $tagExists = -not [string]::IsNullOrWhiteSpace((git tag --list $env:TAG))
          "tag_exists=$($tagExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($tagExists) {
              $tagCommit = (git rev-list -n 1 $env:TAG).Trim()
              Write-Host "Tag '$env:TAG' already exists at commit $tagCommit. The workflow will recover by creating the missing release from this existing immutable tag."
          }
          else {
              Write-Host "Tag '$env:TAG' does not exist yet and will be created for this release."
          }

          $releaseApi = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG"
          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
          }

          try {
              Invoke-RestMethod -Uri $releaseApi -Headers $headers -Method Get -ErrorAction Stop | Out-Null
              throw "GitHub release '$env:TAG' already exists. Releases are immutable; bump the manifest version instead."
          }
          catch {
              $statusCode = $null
              if ($_.Exception.Response) {
                  $statusCode = [int]$_.Exception.Response.StatusCode
              }

              if ($statusCode -ne 404) {
                  throw
              }
          }

          Write-Host "No GitHub release exists for '$env:TAG'; release creation may continue."

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          IS_PRERELEASE: ${{ steps.release.outputs.is_prerelease }}
          TAG_EXISTS: ${{ steps.existing.outputs.tag_exists }}
        run: |
          $ErrorActionPreference = 'Stop'

          $arguments = @(
              'release', 'create', $env:TAG,
              '--repo', $env:GITHUB_REPOSITORY,
              '--title', "WindowsDeviceLink $env:RELEASE_VERSION",
              '--generate-notes'
          )

          if ($env:TAG_EXISTS -eq 'true') {
              # Recovery path: a previous release attempt may have created the tag before
              # GitHub failed to create the Release object. Never move or recreate that tag.
              $arguments += '--verify-tag'
          }
          else {
              $arguments += @('--target', $env:GITHUB_SHA)
          }

          if ($env:IS_PRERELEASE -eq 'True') {
              $arguments += '--prerelease'
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }

          Write-Host "Created GitHub release $env:TAG."
