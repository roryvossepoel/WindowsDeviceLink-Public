name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Expected release version, for example 0.4.3-preview1. Leave empty to use the manifest.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release source
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:SOURCE_REF -ne 'main') {
              throw "GitHub releases must be created from the main branch. Current ref: '$env:SOURCE_REF'."
          }

          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
          }

          $commitApi = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$env:SOURCE_SHA"
          $commit = Invoke-RestMethod -Uri $commitApi -Headers $headers -Method Get -ErrorAction Stop

          if (-not $commit.commit.verification.verified) {
              $reason = [string]$commit.commit.verification.reason
              throw "Release source commit '$env:SOURCE_SHA' is not GitHub Verified. Verification reason: '$reason'. Merge the release PR through GitHub before creating a release."
          }

          $remoteMain = (git rev-parse origin/main).Trim()
          if ($remoteMain -ne $env:SOURCE_SHA) {
              throw "Release source '$env:SOURCE_SHA' is not the current origin/main commit '$remoteMain'."
          }

          Write-Host "Release source is GitHub Verified and matches origin/main: $env:SOURCE_SHA"

      - name: Validate and resolve version
        id: release
        shell: powershell
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $PWD 'src\WindowsDeviceLink\WindowsDeviceLink.psd1'
          $manifest = Test-ModuleManifest -Path $manifestPath -ErrorAction Stop
          $manifestData = Import-PowerShellDataFile -Path $manifestPath

          $baseVersion = $manifest.Version.ToString()
          $prerelease = [string]$manifestData.PrivateData.PSData.Prerelease
          $releaseVersion = if ([string]::IsNullOrWhiteSpace($prerelease)) {
              $baseVersion
          } else {
              "$baseVersion-$prerelease"
          }
          $tag = "v$releaseVersion"

          if (-not [string]::IsNullOrWhiteSpace($env:EXPECTED_VERSION) -and $env:EXPECTED_VERSION -ne $releaseVersion) {
              throw "Expected version '$($env:EXPECTED_VERSION)' does not match manifest version '$releaseVersion'."
          }

          "release_version=$releaseVersion" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "is_prerelease=$(-not [string]::IsNullOrWhiteSpace($prerelease))" >> $env:GITHUB_OUTPUT

          Write-Host "Resolved release: $tag"

      - name: Check existing tag and release
        id: existing
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          git fetch --tags --force
          $tagExists = -not [string]::IsNullOrWhiteSpace((git tag --list $env:TAG))
          "tag_exists=$($tagExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($tagExists) {
              $tagCommit = (git rev-list -n 1 $env:TAG).Trim()
              Write-Host "Tag '$env:TAG' already exists at commit $tagCommit. It will not be moved or recreated."
          }
          else {
              Write-Host "Tag '$env:TAG' does not exist yet and will be created for this release."
          }

          $releaseApi = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG"
          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
          }

          $releaseExists = $false
          try {
              $existingRelease = Invoke-RestMethod -Uri $releaseApi -Headers $headers -Method Get -ErrorAction Stop
              $releaseExists = $true
              Write-Host "GitHub release '$env:TAG' already exists (release id $($existingRelease.id)). Treating this workflow run as an idempotent success."
          }
          catch {
              $statusCode = $null
              if ($_.Exception.Response) {
                  $statusCode = [int]$_.Exception.Response.StatusCode
              }

              if ($statusCode -ne 404) {
                  throw
              }

              Write-Host "No GitHub release exists for '$env:TAG'; release creation may continue."
          }

          "release_exists=$($releaseExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        if: steps.existing.outputs.release_exists != 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          IS_PRERELEASE: ${{ steps.release.outputs.is_prerelease }}
          TAG_EXISTS: ${{ steps.existing.outputs.tag_exists }}
        run: |
          $ErrorActionPreference = 'Stop'

          $arguments = @(
              'release', 'create', $env:TAG,
              '--repo', $env:GITHUB_REPOSITORY,
              '--title', "WindowsDeviceLink $env:RELEASE_VERSION",
              '--generate-notes'
          )

          if ($env:TAG_EXISTS -eq 'true') {
              # Recovery path: a previous release attempt may have created the tag before
              # GitHub returned an error. Never move or recreate that tag.
              $arguments += '--verify-tag'
          }
          else {
              $arguments += @('--target', $env:GITHUB_SHA)
          }

          if ($env:IS_PRERELEASE -eq 'True') {
              $arguments += '--prerelease'
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
              # GitHub can rarely return an error after persisting the release. Verify
              # the resulting state before treating the operation as failed.
              $verifyArguments = @('release', 'view', $env:TAG, '--repo', $env:GITHUB_REPOSITORY, '--json', 'tagName')
              $null = & gh @verifyArguments 2>$null
              if ($LASTEXITCODE -eq 0) {
                  Write-Warning "GitHub CLI returned an error, but release '$env:TAG' now exists. Treating the operation as successful."
                  exit 0
              }

              throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }

          Write-Host "Created GitHub release $env:TAG."
