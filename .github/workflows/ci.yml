name: Module CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Windows PowerShell 5.1 regression
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build staged Gallery package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'WindowsDeviceLink-Package'
          .\tools\New-GalleryPackage.ps1 -OutputRoot $outputRoot
          "WDL_PACKAGE_ROOT=$outputRoot\WindowsDeviceLink" >> $env:GITHUB_ENV
          "WDL_MODULE_PATH=$outputRoot\WindowsDeviceLink\WindowsDeviceLink.psd1" >> $env:GITHUB_ENV

      - name: Validate public module contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Public-Contract-Validation.ps1 `
            -ModulePath $env:WDL_MODULE_PATH `
            -PackageRoot $env:WDL_PACKAGE_ROOT

      - name: Validate DeviceLinkManager native wrapper
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Native-Manager-Contract-Validation.ps1 -ModulePath $env:WDL_MODULE_PATH

      - name: Validate initializer completion opt-in contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Initialize-Completion-Contract-Validation.ps1

      - name: Validate firmware safety and timestamp parsing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Firmware-Safety-Validation.ps1 -ModulePath $env:WDL_MODULE_PATH

      - name: Validate health states
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Health-State-Validation.ps1 -ModulePath $env:WDL_MODULE_PATH

      - name: Validate local tenant association correlation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Local-Association-Validation.ps1 -ModulePath $env:WDL_MODULE_PATH

      - name: Validate operator GUI contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Gui-Contract-Validation.ps1 -ModulePath $env:WDL_MODULE_PATH

      - name: Validate lifecycle repair planning safety
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Repair-Plan-Validation.ps1 -ModulePath $env:WDL_MODULE_PATH

      - name: Validate DeviceLink preflight decisions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Preflight-Validation.ps1 -ModulePath $env:WDL_MODULE_PATH

      - name: Validate Association JWT parsing and redaction
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\AssociationJwt-Validation.ps1 -ModulePath $env:WDL_MODULE_PATH

      - name: Validate Graph failure-state safety
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Graph-Failure-State-Validation.ps1 -ModulePath $env:WDL_MODULE_PATH

      - name: Validate Graph GET transport and paging
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Graph-Transport-Validation.ps1 -ModulePath $env:WDL_MODULE_PATH

      - name: Validate Graph Device Association API contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Graph-Association-Contract-Validation.ps1 -ModulePath $env:WDL_MODULE_PATH

      - name: Validate cloud-operation parameter boundaries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Online-Method-Validation.ps1 -ModulePath $env:WDL_MODULE_PATH

      - name: Validate authentication and secret handling
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Auth-Security-Validation.ps1 -ModulePath $env:WDL_MODULE_PATH

      - name: Validate authentication orchestration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Auth-Orchestration-Validation.ps1 -ModulePath $env:WDL_MODULE_PATH

      - name: Validate SDK authentication error redaction
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Connect-Auth-Security-Validation.ps1 -ModulePath $env:WDL_MODULE_PATH

      - name: Validate removal authentication error redaction
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Removal-Auth-Security-Validation.ps1 -ModulePath $env:WDL_MODULE_PATH

      - name: Validate webhook response sanitization
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Webhook-Response-Security-Validation.ps1 -ModulePath $env:WDL_MODULE_PATH

      - name: Validate Azure backend contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\Azure-Backend-Contract-Validation.ps1

      - name: Final package safety check
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $forbidden = Join-Path $env:WDL_PACKAGE_ROOT 'Runtime\Windows.Management.Service.dll'
          if (Test-Path -LiteralPath $forbidden) {
              throw 'Forbidden Microsoft runtime DLL is present in the staged Gallery package.'
          }

          $manifest = Test-ModuleManifest -Path $env:WDL_MODULE_PATH -ErrorAction Stop
          Write-Host "Validated WindowsDeviceLink $($manifest.Version) staged package."
